<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .main-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #f0f6fc; }
      .main-sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .card-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
      .card-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: italic; fill: #8b949e; }
      .lbl { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
      .explanation { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.5; }

      .pulse-cyan {
        fill: #38bdf8;
        filter: drop-shadow(0 0 6px #38bdf8);
      }
      .pulse-red {
        fill: #ef4444;
        filter: drop-shadow(0 0 6px #ef4444);
      }
    </style>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#0d1117" />
  <rect x="30" y="30" width="940" height="620" rx="16" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 70)">
    <text class="main-title">Inter-Gateway &amp; Inter-Service Communication Rules</text>
    <text y="24" class="main-sub">How Sub-Gateways and Internal Microservices Legally Communicate in DOMA</text>
  </g>

  <!-- Left: Domain A (Mobility / Trip) -->
  <g transform="translate(60, 130)">
    <rect width="390" height="370" rx="12" fill="#0d111a" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="20" y="30" class="tag" fill="#60a5fa">BOUNDED DOMAIN A: MOBILITY</text>

    <!-- Gateway A -->
    <g transform="translate(55, 55)">
      <rect width="280" height="70" rx="14" fill="#161b26" stroke="#38bdf8" stroke-width="1.5" />
      <text x="140" y="32" class="card-title" text-anchor="middle">Trip Domain Gateway</text>
      <text x="140" y="52" class="card-sub" text-anchor="middle">Tier 2 Sub-Gateway (:8081)</text>
    </g>

    <!-- Services inside Domain A -->
    <g transform="translate(30, 180)">
      <rect width="155" height="65" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="77" y="28" class="card-title" font-size="13" text-anchor="middle">Driver Match</text>
      <text x="77" y="48" class="card-sub" font-size="10" text-anchor="middle">gRPC :9001</text>
    </g>

    <g transform="translate(205, 180)">
      <rect width="155" height="65" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="77" y="28" class="card-title" font-size="13" text-anchor="middle">Route Planner</text>
      <text x="77" y="48" class="card-sub" font-size="10" text-anchor="middle">gRPC :9005</text>
    </g>

    <!-- Intradomain Downward Arrows -->
    <path d="M 125 125 L 105 180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />
    <path d="M 265 125 L 285 180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />

    <!-- Domain Event Bus -->
    <g transform="translate(30, 280)">
      <rect width="330" height="50" rx="6" fill="#182338" stroke="#1d4ed8" />
      <text x="165" y="25" class="lbl" fill="#93c5fd" text-anchor="middle">⚡ Domain Event Bus (Kafka)</text>
      <text x="165" y="42" class="card-sub" font-size="10" text-anchor="middle">Asynchronous Eventual Consistency</text>
    </g>
    <path d="M 107 245 L 107 280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" fill="none" />
    <path d="M 282 245 L 282 280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" fill="none" />
  </g>

  <!-- Right: Domain B (Billing & Fare) -->
  <g transform="translate(550, 130)">
    <rect width="390" height="370" rx="12" fill="#0d111a" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="20" y="30" class="tag" fill="#34d399">BOUNDED DOMAIN B: BILLING</text>

    <!-- Gateway B -->
    <g transform="translate(55, 55)">
      <rect width="280" height="70" rx="14" fill="#161b26" stroke="#38bdf8" stroke-width="1.5" />
      <text x="140" y="32" class="card-title" text-anchor="middle">Billing Domain Gateway</text>
      <text x="140" y="52" class="card-sub" text-anchor="middle">Tier 2 Sub-Gateway (:8083)</text>
    </g>

    <!-- Services inside Domain B -->
    <g transform="translate(30, 180)">
      <rect width="155" height="65" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="77" y="28" class="card-title" font-size="13" text-anchor="middle">Payment Core</text>
      <text x="77" y="48" class="card-sub" font-size="10" text-anchor="middle">gRPC :9017</text>
    </g>

    <g transform="translate(205, 180)">
      <rect width="155" height="65" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="77" y="28" class="card-title" font-size="13" text-anchor="middle">Invoice Engine</text>
      <text x="77" y="48" class="card-sub" font-size="10" text-anchor="middle">gRPC :9018</text>
    </g>

    <!-- Intradomain Downward Arrows -->
    <path d="M 125 125 L 105 180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />
    <path d="M 265 125 L 285 180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />

    <!-- Domain Event Bus -->
    <g transform="translate(30, 280)">
      <rect width="330" height="50" rx="6" fill="#143026" stroke="#047857" />
      <text x="165" y="25" class="lbl" fill="#6ee7b7" text-anchor="middle">⚡ Domain Event Bus (Kafka)</text>
      <text x="165" y="42" class="card-sub" font-size="10" text-anchor="middle">Asynchronous Eventual Consistency</text>
    </g>
    <path d="M 107 245 L 107 280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" fill="none" />
    <path d="M 282 245 L 282 280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" fill="none" />
  </g>

  <!-- ================= COMMUNICATION FLOWS BETWEEN DOMAINS ================= -->

  <!-- 1. ALLOWED: Gateway to Gateway Cross-Domain Contract -->
  <g>
    <path id="cross-gw-flow" d="M 395 220 L 605 220" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)" fill="none" />
    <rect x="420" y="195" width="160" height="26" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.2" />
    <text x="500" y="213" class="lbl" fill="#38bdf8" text-anchor="middle">✅ Cross-Domain gRPC</text>
    
    <!-- Moving pulse dot -->
    <circle r="5" class="pulse-cyan">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 395 220 L 605 220" />
    </circle>
  </g>

  <!-- 2. FORBIDDEN: Direct Leaf-to-Leaf Cross Call -->
  <g>
    <path id="forbidden-flow" d="M 395 340 L 605 340" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)" fill="none" />
    <rect x="410" y="325" width="180" height="28" rx="6" fill="#1e1318" stroke="#ef4444" stroke-width="1.2" />
    <text x="500" y="344" class="lbl" fill="#f87171" text-anchor="middle">🚫 FORBIDDEN DIRECT LEAF</text>
    
    <!-- Red Warning Pulse -->
    <circle r="4.5" class="pulse-red">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 395 340 L 605 340" />
    </circle>
  </g>

  <!-- Bottom Explanatory Summary Panel -->
  <g transform="translate(60, 525)">
    <rect width="880" height="100" rx="10" fill="#0d1117" stroke="#21262d" />
    
    <g transform="translate(25, 20)">
      <text font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">1. Inter-Sub Gateway Communication (Tier-2 to Tier-2):</text>
      <text y="22" class="explanation">When Trip Domain needs billing info, Trip Gateway calls Billing Gateway directly over strongly typed gRPC Protobuf contracts. Leaf services are completely isolated behind their Domain Gateway.</text>
    </g>

    <g transform="translate(25, 62)">
      <text font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#34d399">2. Internal Microservice Communication:</text>
      <text y="22" class="explanation">Synchronous calls are fanned out concurrently by the Domain Gateway (Scatter-Gather). Inter-service data synchronization within the domain is published asynchronously through Transactional Outbox + Kafka Event Bus.</text>
    </g>
  </g>
</svg>
