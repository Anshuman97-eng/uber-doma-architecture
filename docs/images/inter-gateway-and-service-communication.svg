<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .main-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #f0f6fc; }
      .main-sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .card-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
      .card-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-style: italic; fill: #8b949e; }
      .lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
      .explanation { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.5; }

      .pulse-cyan {
        fill: #38bdf8;
        filter: drop-shadow(0 0 6px #38bdf8);
      }
      .pulse-emerald {
        fill: #34d399;
        filter: drop-shadow(0 0 6px #34d399);
      }
      .pulse-purple {
        fill: #c084fc;
        filter: drop-shadow(0 0 6px #c084fc);
      }
      .pulse-red {
        fill: #ef4444;
        filter: drop-shadow(0 0 6px #ef4444);
      }
    </style>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="720" fill="#0d1117" rx="14" />
  <rect x="25" y="25" width="1030" height="670" rx="16" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />

  <!-- Title Block -->
  <g transform="translate(55, 65)">
    <text class="main-title">Inter-Gateway &amp; Same-Domain Interservice Communication</text>
    <text y="24" class="main-sub">Visualizing Intra-Domain gRPC IPC, Domain Event Streaming &amp; Cross-Gateway Routing</text>
  </g>

  <!-- ================= DOMAIN A: MOBILITY & DISPATCH ================= -->
  <g transform="translate(55, 120)">
    <rect width="440" height="420" rx="14" fill="#0d111a" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="20" y="30" class="tag" fill="#60a5fa">BOUNDED DOMAIN A: MOBILITY &amp; DISPATCH</text>

    <!-- Sub-Gateway A -->
    <g transform="translate(70, 48)">
      <rect width="300" height="64" rx="12" fill="#161b26" stroke="#38bdf8" stroke-width="1.5" />
      <text x="150" y="30" class="card-title" text-anchor="middle">Trip Domain Gateway</text>
      <text x="150" y="48" class="card-sub" text-anchor="middle">Tier 2 Sub-Gateway (:8081)</text>
    </g>

    <!-- Service A1: Driver Match -->
    <g transform="translate(25, 160)">
      <rect width="170" height="70" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="85" y="30" class="card-title" font-size="13" text-anchor="middle">Driver Match</text>
      <text x="85" y="50" class="card-sub" font-size="10" text-anchor="middle">gRPC :9003 • DISCO</text>
    </g>

    <!-- Service A2: Route Planner -->
    <g transform="translate(245, 160)">
      <rect width="170" height="70" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="85" y="30" class="card-title" font-size="13" text-anchor="middle">Route Planner</text>
      <text x="85" y="50" class="card-sub" font-size="10" text-anchor="middle">gRPC :9005 • Gurafu</text>
    </g>

    <!-- Gateway Orchestration Arrows Down -->
    <path d="M 150 112 L 110 160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />
    <path d="M 290 112 L 330 160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />

    <!-- === SAME-DOMAIN SYNCHRONOUS INTERSERVICE COMMUNICATION (gRPC IPC) === -->
    <g>
      <!-- Direct bidirectional line between Driver Match and Route Planner -->
      <path id="same-domain-grpc-a" d="M 195 195 L 245 195" stroke="#34d399" stroke-width="2.5" stroke-dasharray="3 2" marker-end="url(#arrow-emerald)" fill="none" />
      <rect x="180" y="170" width="80" height="20" rx="4" fill="#0b1b15" stroke="#059669" />
      <text x="220" y="184" class="lbl" fill="#34d399" font-size="9" text-anchor="middle">gRPC IPC</text>
      <circle r="4" class="pulse-emerald">
        <animateMotion dur="1.4s" repeatCount="indefinite" path="M 195 195 L 245 195" />
      </circle>
    </g>

    <!-- === SAME-DOMAIN ASYNCHRONOUS EVENT STREAMING === -->
    <g transform="translate(25, 275)">
      <rect width="390" height="120" rx="8" fill="#141a29" stroke="#1d4ed8" stroke-width="1.2" />
      <text x="195" y="24" class="lbl" fill="#93c5fd" text-anchor="middle">⚡ Intra-Domain Event Broker (Kafka)</text>
      <text x="195" y="42" class="card-sub" font-size="10" text-anchor="middle">Transactional Outbox Pattern • Async Interservice Events</text>

      <!-- Event Topics -->
      <g transform="translate(20, 56)">
        <rect width="165" height="48" rx="6" fill="#161b26" stroke="#2563eb" />
        <text x="10" y="20" class="lbl" fill="#60a5fa" font-size="10">DriverAvailableEvent</text>
        <text x="10" y="38" class="card-sub" font-size="9">Produced by Supply Locator</text>
      </g>
      <g transform="translate(205, 56)">
        <rect width="165" height="48" rx="6" fill="#161b26" stroke="#2563eb" />
        <text x="10" y="20" class="lbl" fill="#60a5fa" font-size="10">RouteComputedEvent</text>
        <text x="10" y="38" class="card-sub" font-size="9">Consumed by DISCO Matcher</text>
      </g>
    </g>

    <!-- Connector down to Event Broker -->
    <path id="event-feed-1" d="M 110 230 L 110 275" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />
    <path id="event-feed-2" d="M 330 230 L 330 275" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />
    <circle r="3.5" class="pulse-cyan">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 110 230 L 110 275" />
    </circle>
  </g>

  <!-- ================= DOMAIN B: BILLING & FARE ================= -->
  <g transform="translate(585, 120)">
    <rect width="440" height="420" rx="14" fill="#0d111a" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="20" y="30" class="tag" fill="#34d399">BOUNDED DOMAIN B: BILLING &amp; FARES</text>

    <!-- Sub-Gateway B -->
    <g transform="translate(70, 48)">
      <rect width="300" height="64" rx="12" fill="#161b26" stroke="#38bdf8" stroke-width="1.5" />
      <text x="150" y="30" class="card-title" text-anchor="middle">Billing Domain Gateway</text>
      <text x="150" y="48" class="card-sub" text-anchor="middle">Tier 2 Sub-Gateway (:8083)</text>
    </g>

    <!-- Service B1: Payment Core -->
    <g transform="translate(25, 160)">
      <rect width="170" height="70" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="85" y="30" class="card-title" font-size="13" text-anchor="middle">Payment Core</text>
      <text x="85" y="50" class="card-sub" font-size="10" text-anchor="middle">gRPC :9017 • Multi-PSP</text>
    </g>

    <!-- Service B2: Invoice Engine -->
    <g transform="translate(245, 160)">
      <rect width="170" height="70" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="85" y="30" class="card-title" font-size="13" text-anchor="middle">Invoice Engine</text>
      <text x="85" y="50" class="card-sub" font-size="10" text-anchor="middle">gRPC :9018 • Ledger</text>
    </g>

    <!-- Gateway Orchestration Arrows Down -->
    <path d="M 150 112 L 110 160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />
    <path d="M 290 112 L 330 160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-cyan)" fill="none" />

    <!-- === SAME-DOMAIN SYNCHRONOUS INTERSERVICE COMMUNICATION (gRPC IPC) === -->
    <g>
      <path id="same-domain-grpc-b" d="M 195 195 L 245 195" stroke="#34d399" stroke-width="2.5" stroke-dasharray="3 2" marker-end="url(#arrow-emerald)" fill="none" />
      <rect x="180" y="170" width="80" height="20" rx="4" fill="#0b1b15" stroke="#059669" />
      <text x="220" y="184" class="lbl" fill="#34d399" font-size="9" text-anchor="middle">gRPC IPC</text>
      <circle r="4" class="pulse-emerald">
        <animateMotion dur="1.4s" repeatCount="indefinite" path="M 195 195 L 245 195" />
      </circle>
    </g>

    <!-- === SAME-DOMAIN ASYNCHRONOUS EVENT STREAMING === -->
    <g transform="translate(25, 275)">
      <rect width="390" height="120" rx="8" fill="#0d2119" stroke="#047857" stroke-width="1.2" />
      <text x="195" y="24" class="lbl" fill="#6ee7b7" text-anchor="middle">⚡ Intra-Domain Event Broker (Kafka)</text>
      <text x="195" y="42" class="card-sub" font-size="10" text-anchor="middle">Transactional Outbox Pattern • Async Interservice Events</text>

      <!-- Event Topics -->
      <g transform="translate(20, 56)">
        <rect width="165" height="48" rx="6" fill="#161b26" stroke="#059669" />
        <text x="10" y="20" class="lbl" fill="#34d399" font-size="10">PaymentSucceededEvent</text>
        <text x="10" y="38" class="card-sub" font-size="9">Produced by Payment Core</text>
      </g>
      <g transform="translate(205, 56)">
        <rect width="165" height="48" rx="6" fill="#161b26" stroke="#059669" />
        <text x="10" y="20" class="lbl" fill="#34d399" font-size="10">LedgerEntryCreatedEvent</text>
        <text x="10" y="38" class="card-sub" font-size="9">Consumed by Invoice Engine</text>
      </g>
    </g>

    <!-- Connector down to Event Broker -->
    <path id="event-feed-3" d="M 110 230 L 110 275" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-emerald)" fill="none" />
    <path id="event-feed-4" d="M 330 230 L 330 275" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow-emerald)" fill="none" />
    <circle r="3.5" class="pulse-emerald">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 110 230 L 110 275" />
    </circle>
  </g>

  <!-- ================= CROSS-DOMAIN ROUTING BETWEEN GATEWAYS ================= -->
  <g>
    <!-- Allowed Cross-Gateway gRPC -->
    <path id="cross-gw" d="M 425 200 L 655 200" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)" fill="none" />
    <rect x="460" y="174" width="160" height="26" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.2" />
    <text x="540" y="192" class="lbl" fill="#38bdf8" text-anchor="middle">✅ Cross-Gateway gRPC</text>
    <circle r="5" class="pulse-cyan">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 425 200 L 655 200" />
    </circle>
  </g>

  <!-- ================= PROHIBITED DIRECT CROSS-DOMAIN LEAF CALL ================= -->
  <g>
    <path id="prohibited-leaf" d="M 440 320 L 640 320" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)" fill="none" />
    <rect x="450" y="305" width="180" height="28" rx="6" fill="#1e1318" stroke="#ef4444" stroke-width="1.2" />
    <text x="540" y="324" class="lbl" fill="#f87171" text-anchor="middle">🚫 FORBIDDEN CROSS-LEAF</text>
    <circle r="4.5" class="pulse-red">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 440 320 L 640 320" />
    </circle>
  </g>

  <!-- ================= BOTTOM THREE-PILLAR EXPLANATION ================= -->
  <g transform="translate(55, 555)">
    <rect width="970" height="120" rx="10" fill="#0d1117" stroke="#21262d" />

    <!-- Column 1: Same Domain Sync -->
    <g transform="translate(20, 18)">
      <circle cx="8" cy="8" r="5" fill="#34d399" />
      <text x="22" y="12" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399">1. Same-Domain Interservice gRPC:</text>
      <text x="22" y="30" class="explanation">Microservices within the SAME domain directly invoke each other over low-latency internal gRPC stubs (e.g. Driver Match calls Route Planner to get trip ETA). Bounded context is respected.</text>
    </g>

    <!-- Column 2: Same Domain Async -->
    <g transform="translate(20, 54)">
      <circle cx="8" cy="8" r="5" fill="#60a5fa" />
      <text x="22" y="12" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#60a5fa">2. Same-Domain Asynchronous Events:</text>
      <text x="22" y="30" class="explanation">For state synchronization, services emit domain events via the Transactional Outbox pattern into Kafka. Peer services in the same domain react asynchronously without tight temporal coupling.</text>
    </g>

    <!-- Column 3: Cross Domain Rule -->
    <g transform="translate(20, 90)">
      <circle cx="8" cy="8" r="5" fill="#38bdf8" />
      <text x="22" y="12" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">3. Cross-Domain Gateways Only:</text>
      <text x="22" y="30" class="explanation">Services in different domains NEVER communicate directly. All cross-domain queries MUST transit via Tier 2 Sub-Gateways over versioned Protobuf contracts.</text>
    </g>
  </g>
</svg>
