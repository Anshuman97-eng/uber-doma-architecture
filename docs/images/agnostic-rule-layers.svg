<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
      .layer-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
      .layer-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8b949e; }
      .rule-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .rule-desc { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8b949e; line-height: 1.4; }

      .pulse-green { fill: #34d399; filter: drop-shadow(0 0 6px #34d399); }
    </style>

    <marker id="m-down-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="1000" height="480" fill="#0d1117" rx="14" />
  <rect x="25" y="25" width="950" height="430" rx="12" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(55, 60)">
    <text class="title">The 5-Layer Agnostic Dependency Hierarchy</text>
    <text y="22" class="sub">Uber DOMA Rule: Lower layers MUST remain completely agnostic of upper layers</text>
  </g>

  <!-- Layers Stack -->
  <g transform="translate(55, 105)">
    <!-- Layer 5 -->
    <g transform="translate(0, 0)">
      <rect width="560" height="52" rx="8" fill="#161b26" stroke="#30363d" stroke-width="1.2" />
      <text x="18" y="24" class="layer-title">LAYER 5: EDGE INGRESS LAYER</text>
      <text x="18" y="42" class="layer-sub">Tier 1 Edge Gateway • Mobile/Web client facing • TLS termination &amp; AuthN</text>
    </g>

    <!-- Layer 4 -->
    <g transform="translate(0, 64)">
      <rect width="560" height="52" rx="8" fill="#161b26" stroke="#2563eb" stroke-width="1.2" />
      <text x="18" y="24" class="layer-title" fill="#60a5fa">LAYER 4: PRODUCT SOLUTIONS LAYER</text>
      <text x="18" y="42" class="layer-sub">UberX, Uber Pool, Uber Eats Checkout, Fleet Solutions</text>
    </g>

    <!-- Layer 3 -->
    <g transform="translate(0, 128)">
      <rect width="560" height="52" rx="8" fill="#161b26" stroke="#7c3aed" stroke-width="1.2" />
      <text x="18" y="24" class="layer-title" fill="#c084fc">LAYER 3: TIER 2 DOMAIN GATEWAYS</text>
      <text x="18" y="42" class="layer-sub">Mobility Gateway, Trip Gateway, Billing Gateway, Delivery Gateway</text>
    </g>

    <!-- Layer 2 -->
    <g transform="translate(0, 192)">
      <rect width="560" height="52" rx="8" fill="#161b26" stroke="#059669" stroke-width="1.2" />
      <text x="18" y="24" class="layer-title" fill="#34d399">LAYER 2: CORE DOMAIN MICROSERVICES (LEAF)</text>
      <text x="18" y="42" class="layer-sub">Services 01-34: Supply, Driver Match, Invoicing, Dispatch, Catalog</text>
    </g>

    <!-- Layer 1 -->
    <g transform="translate(0, 256)">
      <rect width="560" height="52" rx="8" fill="#182848" stroke="#38bdf8" stroke-width="1.5" />
      <text x="18" y="24" class="layer-title" fill="#38bdf8">LAYER 1: PLATFORM INFRASTRUCTURE (AGNOSTIC BASE)</text>
      <text x="18" y="42" class="layer-sub" fill="#93c5fd">Services 35-40: Telemetry Ingest, Kafka Hub, Flipr Feature Flags</text>
    </g>
  </g>

  <!-- Downward Flow Vector -->
  <g transform="translate(635, 110)">
    <line x1="0" y1="10" x2="0" y2="295" stroke="#10b981" stroke-width="3" stroke-dasharray="4 3" marker-end="url(#m-down-green)" />
    <circle r="5" class="pulse-green">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M 0 10 L 0 295" />
    </circle>
  </g>

  <!-- Right Side Rules Panel -->
  <g transform="translate(670, 105)">
    <rect width="275" height="308" rx="10" fill="#0d111a" stroke="#21262d" />
    <text x="18" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">ARCHITECTURAL LAWS</text>

    <!-- Rule 1 -->
    <g transform="translate(15, 48)">
      <rect width="245" height="74" rx="6" fill="#161b26" stroke="#059669" />
      <text x="12" y="22" class="rule-title" fill="#34d399">✅ DOWNWARD ONLY</text>
      <text x="12" y="40" class="rule-desc">Upper layers invoke lower layers.</text>
      <text x="12" y="56" class="rule-desc">Never the reverse.</text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(15, 132)">
      <rect width="245" height="74" rx="6" fill="#161b26" stroke="#ef4444" />
      <text x="12" y="22" class="rule-title" fill="#f87171">🚫 ZERO UPWARD DEPENDENCY</text>
      <text x="12" y="40" class="rule-desc">Lower layers are 100% agnostic</text>
      <text x="12" y="56" class="rule-desc">of callers &amp; upper business state.</text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(15, 216)">
      <rect width="245" height="74" rx="6" fill="#161b26" stroke="#2563eb" />
      <text x="12" y="22" class="rule-title" fill="#60a5fa">🔒 GATEWAY-ONLY CROSSING</text>
      <text x="12" y="40" class="rule-desc">Inter-domain calls pass ONLY via</text>
      <text x="12" y="56" class="rule-desc">Tier 2 Sub-Domain Gateways.</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(55, 420)">
    <text class="layer-sub" fill="#6e7681">Enforced at compile-time via ArchUnit tests and runtime via network security policies.</text>
  </g>
</svg>
