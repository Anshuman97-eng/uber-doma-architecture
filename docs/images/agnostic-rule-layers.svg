<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; }
      .layer-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .rule-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="m-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="m-up-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <g transform="translate(40, 35)">
    <text class="title">THE 5-LAYER AGNOSTIC DEPENDENCY HIERARCHY</text>
    <text y="20" class="sub">Uber DOMA Rule: Lower layers MUST remain completely agnostic of upper layers. No circular dependencies.</text>
  </g>

  <!-- Layers Stack -->
  <g transform="translate(60, 80)">
    <!-- Layer 5 -->
    <g transform="translate(0, 0)">
      <rect width="600" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
      <text x="20" y="24" class="layer-title" fill="#0f172a">LAYER 5: EDGE &amp; INGRESS LAYER</text>
      <text x="20" y="42" class="layer-sub">Tier 1 Edge Gateway • Mobile/Web client facing • TLS termination &amp; AuthN</text>
    </g>

    <!-- Layer 4 -->
    <g transform="translate(0, 68)">
      <rect width="600" height="52" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" />
      <text x="20" y="24" class="layer-title" fill="#1d4ed8">LAYER 4: PRODUCT &amp; FEATURE LAYER</text>
      <text x="20" y="42" class="layer-sub">UberX, Uber Pool, Uber Eats Checkout, Fleet Partner Solutions</text>
    </g>

    <!-- Layer 3 -->
    <g transform="translate(0, 136)">
      <rect width="600" height="52" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" />
      <text x="20" y="24" class="layer-title" fill="#7e22ce">LAYER 3: TIER 2 DOMAIN GATEWAYS</text>
      <text x="20" y="42" class="layer-sub">Mobility Gateway, Billing Gateway, Delivery Gateway, Identity Gateway</text>
    </g>

    <!-- Layer 2 -->
    <g transform="translate(0, 204)">
      <rect width="600" height="52" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5" />
      <text x="20" y="24" class="layer-title" fill="#15803d">LAYER 2: CORE DOMAIN MICROSERVICES (LEAF)</text>
      <text x="20" y="42" class="layer-sub">Services 01-34: Supply, Matching, Invoicing, Dispatch, Catalog, etc.</text>
    </g>

    <!-- Layer 1 -->
    <g transform="translate(0, 272)">
      <rect width="600" height="52" rx="8" fill="#0f172a" />
      <text x="20" y="24" class="layer-title" fill="#38bdf8">LAYER 1: PLATFORM &amp; INFRASTRUCTURE (AGNOSTIC BASE)</text>
      <text x="20" y="42" class="layer-sub" fill="#94a3b8">Telemetry Ingest, Kafka Hub, Flipr Feature Flags, DBs, Auth Token Service</text>
    </g>
  </g>

  <!-- Right Side Rules Panel -->
  <g transform="translate(700, 80)">
    <rect width="240" height="324" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">ARCHITECTURAL RULES</text>

    <!-- Rule 1: Downward allowed -->
    <g transform="translate(20, 60)">
      <rect width="200" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#166534">✅ DOWNWARD ONLY</text>
      <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#15803d">Upper layers call lower</text>
      <text x="12" y="56" font-family="-apple-system, sans-serif" font-size="10" fill="#15803d">layers synchronously.</text>
    </g>

    <!-- Rule 2: Upward forbidden -->
    <g transform="translate(20, 145)">
      <rect width="200" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#991b1b">🚫 NO UPWARD CALLS</text>
      <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#b91c1c">Lower layer NEVER knows</text>
      <text x="12" y="56" font-family="-apple-system, sans-serif" font-size="10" fill="#b91c1c">about upper layer state.</text>
    </g>

    <!-- Rule 3: Cross domain -->
    <g transform="translate(20, 230)">
      <rect width="200" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af">🔒 ZERO LEAF CROSSING</text>
      <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#1d4ed8">Cross-domain calls pass</text>
      <text x="12" y="56" font-family="-apple-system, sans-serif" font-size="10" fill="#1d4ed8">ONLY via Tier-2 Gateways.</text>
    </g>
  </g>

  <!-- Connecting Arrows -->
  <line x1="675" y1="95" x2="675" y2="390" stroke="#16a34a" stroke-width="3" marker-end="url(#m-down)" />
</svg>
