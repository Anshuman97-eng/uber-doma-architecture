<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .hdr { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .subhdr { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
      .box-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .card-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
      .card-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-style: italic; fill: #8b949e; }
      .badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
      .pulse-blue { fill: #38bdf8; filter: drop-shadow(0 0 6px #38bdf8); }
    </style>

    <marker id="m-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="1100" height="480" fill="#0d1117" rx="14" />
  <rect x="25" y="25" width="1050" height="430" rx="12" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(55, 60)">
    <text class="hdr">Two-Tier Gateway Protocol Transcoding Lifecycle</text>
    <text y="24" class="subhdr">Public HTTPS/JSON Ingress Transcoded into Low-Latency Multiplexed gRPC</text>
  </g>

  <!-- Step 1: Client -->
  <g transform="translate(55, 115)">
    <rect width="180" height="250" rx="10" fill="#0d111a" stroke="#30363d" stroke-dasharray="3 3" />
    <text x="90" y="32" class="box-tag" fill="#6e7681" text-anchor="middle">CLIENT APPS</text>
    <circle cx="90" cy="85" r="28" fill="#161b26" stroke="#38bdf8" stroke-width="1.2" />
    <text x="90" y="93" font-size="24" text-anchor="middle">📱</text>
    <text x="90" y="140" class="card-title" text-anchor="middle">Mobile Client</text>
    <text x="90" y="160" class="card-sub" text-anchor="middle">Rider &amp; Driver Apps</text>
    <g transform="translate(20, 185)">
      <rect width="140" height="24" rx="4" fill="#161b26" stroke="#21262d" />
      <text x="70" y="16" class="badge" fill="#93c5fd" text-anchor="middle">HTTPS / JSON</text>
    </g>
    <g transform="translate(20, 215)">
      <rect width="140" height="24" rx="4" fill="#161b26" stroke="#21262d" />
      <text x="70" y="16" class="badge" fill="#94a3b8" text-anchor="middle">JWT Bearer Auth</text>
    </g>
  </g>

  <!-- Flow 1: Client -> Edge -->
  <path id="flow-c-e" d="M 235 240 L 305 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#m-arrow)" fill="none" />
  <circle r="4.5" class="pulse-blue">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 235 240 L 305 240" />
  </circle>

  <!-- Step 2: Tier 1 Edge Gateway -->
  <g transform="translate(315, 115)">
    <rect width="230" height="250" rx="10" fill="#0d111a" stroke="#2563eb" stroke-dasharray="3 3" />
    <text x="115" y="32" class="box-tag" fill="#60a5fa" text-anchor="middle">TIER 1: EDGE GATEWAY</text>
    <g transform="translate(20, 50)">
      <rect width="190" height="45" rx="8" fill="#182848" stroke="#38bdf8" />
      <text x="95" y="24" class="card-title" font-size="12" fill="#38bdf8" text-anchor="middle">Perimeter Security</text>
      <text x="95" y="38" class="card-sub" font-size="10" fill="#93c5fd" text-anchor="middle">WAF • DDoS Shield</text>
    </g>
    <g transform="translate(20, 105)">
      <rect width="190" height="40" rx="6" fill="#161b26" stroke="#30363d" />
      <text x="95" y="25" class="card-sub" text-anchor="middle">🔑 OAuth2/JWT Validation</text>
    </g>
    <g transform="translate(20, 155)">
      <rect width="190" height="40" rx="6" fill="#161b26" stroke="#30363d" />
      <text x="95" y="25" class="card-sub" text-anchor="middle">🚦 Global Rate Limiter</text>
    </g>
    <g transform="translate(20, 205)">
      <rect width="190" height="34" rx="6" fill="#161b26" stroke="#30363d" />
      <text x="95" y="21" class="card-sub" text-anchor="middle">🔀 Path Route: :8080</text>
    </g>
  </g>

  <!-- Flow 2: Edge -> Tier 2 -->
  <path id="flow-e-d" d="M 545 240 L 615 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#m-arrow)" fill="none" />
  <circle r="4.5" class="pulse-blue">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M 545 240 L 615 240" />
  </circle>

  <!-- Step 3: Tier 2 Domain Gateway -->
  <g transform="translate(625, 115)">
    <rect width="220" height="250" rx="10" fill="#0d111a" stroke="#7c3aed" stroke-dasharray="3 3" />
    <text x="110" y="32" class="box-tag" fill="#c084fc" text-anchor="middle">TIER 2: DOMAIN GATEWAY</text>
    <g transform="translate(15, 50)">
      <rect width="190" height="45" rx="8" fill="#201a3d" stroke="#a855f7" />
      <text x="95" y="24" class="card-title" font-size="12" fill="#d8b4fe" text-anchor="middle">Protocol Transcoder</text>
      <text x="95" y="38" class="card-sub" font-size="10" fill="#e9d5ff" text-anchor="middle">REST ➔ Binary gRPC</text>
    </g>
    <g transform="translate(15, 105)">
      <rect width="190" height="40" rx="6" fill="#161b26" stroke="#30363d" />
      <text x="95" y="25" class="card-sub" text-anchor="middle">⚡ Parallel Scatter-Gather</text>
    </g>
    <g transform="translate(15, 155)">
      <rect width="190" height="40" rx="6" fill="#161b26" stroke="#30363d" />
      <text x="95" y="25" class="card-sub" text-anchor="middle">🛡️ Domain Boundary Guard</text>
    </g>
    <g transform="translate(15, 205)">
      <rect width="190" height="34" rx="6" fill="#161b26" stroke="#30363d" />
      <text x="95" y="21" class="card-sub" text-anchor="middle">🔄 Circuit Breakers (:8081)</text>
    </g>
  </g>

  <!-- Flow 3: Tier 2 -> Leaf Services -->
  <path id="flow-d-m1" d="M 845 200 L 905 160" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#m-arrow)" fill="none" />
  <path id="flow-d-m2" d="M 845 240 L 905 240" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#m-arrow)" fill="none" />
  <path id="flow-d-m3" d="M 845 280 L 905 320" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#m-arrow)" fill="none" />
  
  <circle r="4" class="pulse-blue">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 845 200 L 905 160" />
  </circle>
  <circle r="4" class="pulse-blue">
    <animateMotion dur="2.1s" repeatCount="indefinite" path="M 845 240 L 905 240" />
  </circle>
  <circle r="4" class="pulse-blue">
    <animateMotion dur="1.9s" repeatCount="indefinite" path="M 845 280 L 905 320" />
  </circle>

  <!-- Step 4: Leaf Services -->
  <g transform="translate(915, 115)">
    <!-- Service 1 -->
    <g transform="translate(0, 10)">
      <rect width="140" height="60" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="70" y="24" class="card-title" font-size="12" text-anchor="middle">Supply Svc</text>
      <text x="70" y="44" class="card-sub" font-size="10" fill="#34d399" text-anchor="middle">gRPC :9001</text>
    </g>
    <!-- Service 2 -->
    <g transform="translate(0, 90)">
      <rect width="140" height="60" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="70" y="24" class="card-title" font-size="12" text-anchor="middle">Dispatch Svc</text>
      <text x="70" y="44" class="card-sub" font-size="10" fill="#34d399" text-anchor="middle">gRPC :9003</text>
    </g>
    <!-- Service 3 -->
    <g transform="translate(0, 170)">
      <rect width="140" height="60" rx="8" fill="#161b26" stroke="#30363d" />
      <text x="70" y="24" class="card-title" font-size="12" text-anchor="middle">Routing Svc</text>
      <text x="70" y="44" class="card-sub" font-size="10" fill="#34d399" text-anchor="middle">gRPC :9005</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(55, 395)">
    <rect width="1000" height="35" rx="6" fill="#0d1117" stroke="#21262d" />
    <text x="20" y="22" class="box-tag" fill="#6e7681">PROTOCOL FLOW:</text>
    <text x="145" y="22" class="card-sub" fill="#e6edf3">HTTPS Ingress ➔ Edge Decryption ➔ Internal HTTP/2 Multiplexing ➔ Non-Blocking gRPC Stubs</text>
  </g>
</svg>
