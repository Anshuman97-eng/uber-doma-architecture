<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
      .lbl { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
      .bar-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .time-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
      .comment { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1000" height="420" fill="#0d1117" rx="14" />
  <rect x="25" y="25" width="950" height="370" rx="12" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(55, 60)">
    <text class="title">Beating the "Network Tax": Latency Timeline</text>
    <text y="22" class="sub">Sequential Flat REST Mesh vs. DOMA Tier-2 Reactive gRPC Scatter-Gather</text>
  </g>

  <!-- Pattern 1: Sequential Flat REST -->
  <g transform="translate(55, 110)">
    <rect width="890" height="110" rx="8" fill="#191216" stroke="#991b1b" stroke-dasharray="3 3" />
    <text x="20" y="26" class="lbl" fill="#f87171">❌ FLAT MICROSERVICE MESH: SEQUENTIAL HTTP/1.1 REST</text>
    <text x="870" y="26" class="time-text" fill="#ef4444" text-anchor="end">Total: ~142ms</text>

    <!-- Stacked Timeline -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="160" height="28" rx="4" fill="#991b1b" />
      <text x="80" y="18" class="bar-text" text-anchor="middle">Find Driver (45ms)</text>

      <rect x="165" y="0" width="120" height="28" rx="4" fill="#b91c1c" />
      <text x="225" y="18" class="bar-text" text-anchor="middle">Surge (32ms)</text>

      <rect x="290" y="0" width="140" height="28" rx="4" fill="#dc2626" />
      <text x="360" y="18" class="bar-text" text-anchor="middle">ETA Calc (38ms)</text>

      <rect x="435" y="0" width="110" height="28" rx="4" fill="#ef4444" />
      <text x="490" y="18" class="bar-text" text-anchor="middle">Route (27ms)</text>

      <!-- Trailing dotted line -->
      <line x1="550" y1="14" x2="800" y2="14" stroke="#7f1d1d" stroke-dasharray="2 3" />
    </g>
    <text x="20" y="94" class="comment">Latency compounds additively: Sum(T1 + T2 + T3 + T4) + JSON parsing + TCP reconnects</text>
  </g>

  <!-- Pattern 2: Parallel Scatter-Gather gRPC -->
  <g transform="translate(55, 240)">
    <rect width="890" height="130" rx="8" fill="#0f1f1a" stroke="#059669" stroke-dasharray="3 3" />
    <text x="20" y="26" class="lbl" fill="#34d399">✅ UBER DOMA TIER-2 GATEWAY: REACTIVE PARALLEL gRPC (HTTP/2)</text>
    <text x="870" y="26" class="time-text" fill="#10b981" text-anchor="end">Total: ~34ms (4.1x Faster)</text>

    <!-- Parallel Lines -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="120" height="14" rx="3" fill="#059669" />
      <text x="60" y="11" class="bar-text" font-size="9" text-anchor="middle">Find Driver (28ms)</text>

      <rect x="0" y="18" width="80" height="14" rx="3" fill="#10b981" />
      <text x="40" y="29" class="bar-text" font-size="9" text-anchor="middle">Surge (18ms)</text>

      <rect x="0" y="36" width="150" height="14" rx="3" fill="#34d399" />
      <text x="75" y="47" class="bar-text" font-size="9" fill="#064e3b" text-anchor="middle">ETA Calc (34ms - Max Bound)</text>

      <rect x="0" y="54" width="95" height="14" rx="3" fill="#059669" />
      <text x="47" y="65" class="bar-text" font-size="9" text-anchor="middle">Route (22ms)</text>

      <!-- Bound indicator -->
      <line x1="150" y1="-2" x2="150" y2="72" stroke="#34d399" stroke-width="2" stroke-dasharray="2 2" />
      <text x="165" y="38" class="lbl" fill="#34d399">Bounded by Max(T_i) = 34ms</text>
    </g>
    <text x="20" y="116" class="comment">All requests dispatched concurrently via Project Reactor Mono.zip over persistent HTTP/2 connection</text>
  </g>
</svg>
