<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .main-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 28px; font-weight: 600; fill: #f0f6fc; }
      .main-sub { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #8b949e; }
      .layer-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #6e7681; letter-spacing: 1.5px; }
      .client-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #e6edf3; }
      .edge-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; }
      .edge-sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-style: italic; fill: #93c5fd; }
      .gateway-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #f0f6fc; }
      .gateway-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: italic; fill: #8b949e; }
      .svc-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f6fc; }
      .svc-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-style: italic; fill: #8b949e; }
      .flow-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: italic; fill: #8b949e; }
      .legend-lbl { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #8b949e; }
      .rule-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #8b949e; }
      .rule-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #6e7681; letter-spacing: 1px; }
      .domain-ctx-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; }

      .pulse {
        fill: #38bdf8;
        filter: drop-shadow(0 0 6px #38bdf8);
      }
      .pulse-green {
        fill: #34d399;
        filter: drop-shadow(0 0 6px #34d399);
      }
      .pulse-red {
        fill: #ef4444;
        filter: drop-shadow(0 0 6px #ef4444);
      }
    </style>

    <filter id="blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="960" fill="#0d1117" />

  <!-- Header Title -->
  <g transform="translate(45, 45)">
    <text class="main-title">Uber DOMA Architecture</text>
    <text y="26" class="main-sub">Domain-Oriented Microservice Architecture — Tiered Traffic Routing</text>
  </g>

  <!-- Outer Container Card -->
  <g transform="translate(45, 95)">
    <rect width="910" height="740" rx="16" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />

    <!-- ================= 1. CLIENT LAYER ================= -->
    <g transform="translate(45, 25)">
      <rect width="820" height="80" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">CLIENT LAYER</text>

      <g transform="translate(310, 18)">
        <rect width="200" height="46" rx="23" fill="#181d27" stroke="#363e4f" stroke-width="1.2" />
        <text x="100" y="29" class="client-text" text-anchor="middle">Mobile Client</text>
      </g>
    </g>

    <!-- Path: Client -> Edge Gateway -->
    <path id="path-client-edge" d="M 455 105 L 455 145" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <text x="455" y="125" class="flow-label" text-anchor="middle">gRPC / HTTP</text>
    <circle r="4.5" class="pulse">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 455 105 L 455 145" />
    </circle>

    <!-- ================= 2. EDGE GATEWAY LAYER ================= -->
    <g transform="translate(45, 125)">
      <rect width="820" height="110" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">EDGE GATEWAY LAYER (TIER 1)</text>

      <g transform="translate(285, 22)">
        <rect width="250" height="68" rx="34" fill="#182848" stroke="#38bdf8" stroke-width="1.5" filter="url(#blue-glow)" />
        <text x="125" y="32" class="edge-title" text-anchor="middle">Edge Layer Gateway</text>
        <text x="125" y="52" class="edge-sub" text-anchor="middle">Ingress Auth &amp; Routing</text>
      </g>
    </g>

    <!-- Paths from Edge Gateway to Domain Gateways -->
    <path id="path-edge-trip" d="M 370 193 C 330 193 245 193 245 281" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 370 193 C 330 193 245 193 245 281" />
    </circle>

    <path id="path-edge-fare" d="M 540 193 C 580 193 665 193 665 281" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 540 193 C 580 193 665 193 665 281" />
    </circle>

    <!-- ================= 3. DOMAIN GATEWAY LAYER ================= -->
    <g transform="translate(45, 255)">
      <rect width="820" height="140" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">DOMAIN GATEWAY LAYER (TIER 2)</text>

      <!-- Trip Domain Gateway -->
      <g transform="translate(115, 26)">
        <rect width="170" height="80" rx="16" fill="#161b26" stroke="#363e4f" stroke-width="1.2" />
        <text x="85" y="38" class="gateway-title" text-anchor="middle">Trip Domain</text>
        <text x="85" y="58" class="gateway-sub" text-anchor="middle">Gateway Tier</text>
      </g>

      <!-- Fare Domain Gateway -->
      <g transform="translate(535, 26)">
        <rect width="170" height="80" rx="16" fill="#161b26" stroke="#363e4f" stroke-width="1.2" />
        <text x="85" y="38" class="gateway-title" text-anchor="middle">Fare Domain</text>
        <text x="85" y="58" class="gateway-sub" text-anchor="middle">Gateway Tier</text>
      </g>

      <!-- Cross-Domain Gateway Link -->
      <path id="path-cross-domain" d="M 285 66 L 535 66" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
      <text x="410" y="60" class="flow-label" text-anchor="middle">Cross-Domain gRPC</text>
      <circle r="4.5" class="pulse">
        <animateMotion dur="2.4s" repeatCount="indefinite" path="M 285 66 L 535 66" />
      </circle>
    </g>

    <!-- ================= EXACT CONNECTOR PATHS DOWN TO MICROSERVICES ================= -->
    <!-- Path 1: Trip Gateway to Driver Match (lands directly at top of Driver Match card: x=152, y=485) -->
    <path id="path-trip-driver" d="M 200 361 C 200 410 152 425 152 485" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 200 361 C 200 410 152 425 152 485" />
    </circle>

    <!-- Path 2: Trip Gateway to Route Planner (lands directly at top of Route Planner card: x=342, y=485) -->
    <path id="path-trip-route" d="M 290 361 C 290 410 342 425 342 485" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.3s" repeatCount="indefinite" path="M 290 361 C 290 410 342 425 342 485" />
    </circle>

    <!-- Path 3: Fare Gateway to Payment Core (lands directly at top of Payment Core card: x=568, y=485) -->
    <path id="path-fare-payment" d="M 620 361 C 620 410 568 425 568 485" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.1s" repeatCount="indefinite" path="M 620 361 C 620 410 568 425 568 485" />
    </circle>

    <!-- Path 4: Fare Gateway to Invoice Engine (lands directly at top of Invoice Engine card: x=758, y=485) -->
    <path id="path-fare-invoice" d="M 710 361 C 710 410 758 425 758 485" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 710 361 C 710 410 758 425 758 485" />
    </circle>

    <!-- ================= 4. MICROSERVICE LAYER ================= -->
    <g transform="translate(45, 415)">
      <rect width="820" height="255" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">MICROSERVICE LAYER (BOUNDED CONTEXTS &amp; INTERSERVICE IPC)</text>

      <!-- ================= BOUNDED DOMAIN 1: TRIP/MOBILITY CONTEXT ================= -->
      <g transform="translate(20, 36)">
        <rect width="365" height="130" rx="8" fill="#0d111a" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 2" />
        <text x="14" y="20" class="domain-ctx-tag" fill="#60a5fa">BOUNDED CONTEXT: TRIP DOMAIN</text>

        <!-- Driver Match (top is at y=34, center is at x=87) -->
        <g transform="translate(15, 34)">
          <rect width="145" height="68" rx="8" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
          <text x="72" y="30" class="svc-title" text-anchor="middle">Driver Match</text>
          <text x="72" y="48" class="svc-sub" text-anchor="middle">Microservice</text>
        </g>

        <!-- Route Planner (top is at y=34, center is at x=277) -->
        <g transform="translate(205, 34)">
          <rect width="145" height="68" rx="8" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
          <text x="72" y="30" class="svc-title" text-anchor="middle">Route Planner</text>
          <text x="72" y="48" class="svc-sub" text-anchor="middle">Microservice</text>
        </g>

        <!-- SAME-DOMAIN gRPC IPC ARROW (Driver Match -> Route Planner) -->
        <path id="intra-grpc-trip" d="M 160 68 L 205 68" stroke="#34d399" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrow-green)" fill="none" />
        <rect x="162" y="45" width="42" height="16" rx="3" fill="#082015" stroke="#059669" />
        <text x="183" y="56" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">gRPC</text>
        <circle r="3.5" class="pulse-green">
          <animateMotion dur="1.2s" repeatCount="indefinite" path="M 160 68 L 205 68" />
        </circle>

        <text x="182" y="118" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399" text-anchor="middle">✔ Intra-Domain Interservice gRPC IPC</text>
      </g>

      <!-- ================= BOUNDED DOMAIN 2: FARE/BILLING CONTEXT ================= -->
      <g transform="translate(435, 36)">
        <rect width="365" height="130" rx="8" fill="#0d111a" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 2" />
        <text x="14" y="20" class="domain-ctx-tag" fill="#34d399">BOUNDED CONTEXT: FARE DOMAIN</text>

        <!-- Payment Core -->
        <g transform="translate(15, 34)">
          <rect width="145" height="68" rx="8" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
          <text x="72" y="30" class="svc-title" text-anchor="middle">Payment Core</text>
          <text x="72" y="48" class="svc-sub" text-anchor="middle">Microservice</text>
        </g>

        <!-- Invoice Engine -->
        <g transform="translate(205, 34)">
          <rect width="145" height="68" rx="8" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
          <text x="72" y="30" class="svc-title" text-anchor="middle">Invoice Engine</text>
          <text x="72" y="48" class="svc-sub" text-anchor="middle">Microservice</text>
        </g>

        <!-- SAME-DOMAIN gRPC IPC ARROW (Payment Core -> Invoice Engine) -->
        <path id="intra-grpc-fare" d="M 160 68 L 205 68" stroke="#34d399" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrow-green)" fill="none" />
        <rect x="162" y="45" width="42" height="16" rx="3" fill="#082015" stroke="#059669" />
        <text x="183" y="56" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">gRPC</text>
        <circle r="3.5" class="pulse-green">
          <animateMotion dur="1.2s" repeatCount="indefinite" path="M 160 68 L 205 68" />
        </circle>

        <text x="182" y="118" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399" text-anchor="middle">✔ Intra-Domain Interservice gRPC IPC</text>
      </g>

      <!-- ================= PROHIBITED DIRECT CROSS-DOMAIN LEAF CALL ================= -->
      <g transform="translate(0, 175)">
        <path id="forbidden-cross-call" d="M 297 0 C 297 32 522 32 522 0" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-red)" fill="none" />
        <rect x="330" y="18" width="180" height="24" rx="4" fill="#201116" stroke="#ef4444" stroke-width="1.2" />
        <text x="420" y="34" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f87171" text-anchor="middle">🚫 BLOCKED: CROSS-DOMAIN CALL</text>
        <circle r="4" class="pulse-red">
          <animateMotion dur="2s" repeatCount="indefinite" path="M 297 0 C 297 32 522 32 522 0" />
        </circle>
      </g>

      <text x="410" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e" text-anchor="middle">Services CANNOT call outside their domain directly. All cross-domain traffic MUST route via Tier-2 Gateways.</text>
    </g>

    <!-- Legend -->
    <g transform="translate(60, 690)">
      <g transform="translate(0, 0)">
        <rect width="14" height="14" rx="4" fill="#182848" stroke="#38bdf8" stroke-width="1.2" />
        <text x="20" y="12" class="legend-lbl">Ingress Gateway</text>
      </g>

      <g transform="translate(140, 0)">
        <rect width="14" height="14" rx="4" fill="#161b26" stroke="#6e7681" stroke-width="1.2" />
        <text x="20" y="12" class="legend-lbl">Domain Gateway</text>
      </g>

      <g transform="translate(280, 0)">
        <rect width="14" height="14" rx="4" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
        <text x="20" y="12" class="legend-lbl">Microservice Node</text>
      </g>

      <g transform="translate(430, 0)">
        <line x1="0" y1="7" x2="20" y2="7" stroke="#34d399" stroke-width="2" stroke-dasharray="2 2" />
        <circle cx="10" cy="7" r="3.5" fill="#34d399" />
        <text x="28" y="12" class="legend-lbl" fill="#34d399">Same-Domain gRPC (Allowed)</text>
      </g>

      <g transform="translate(650, 0)">
        <line x1="0" y1="7" x2="20" y2="7" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2" />
        <circle cx="10" cy="7" r="3.5" fill="#ef4444" />
        <text x="28" y="12" class="legend-lbl" fill="#f87171">Cross-Domain Leaf Call (Blocked)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: DOMA Topology Overview | SYSTEM RULE -->
  <g transform="translate(45, 855)">
    <rect width="910" height="60" rx="10" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />
    <text x="24" y="35" class="rule-title">DOMA Ride Sharing Topology</text>
    <text x="886" y="35" class="rule-tag" text-anchor="end">SYSTEM RULE: AGNOSTIC DOWNWARD DEPENDENCIES &amp; ZERO LEAF-TO-LEAF CROSSING</text>
  </g>
</svg>
