<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .main-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 28px; font-weight: 600; fill: #f0f6fc; }
      .main-sub { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #8b949e; }
      .layer-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #6e7681; letter-spacing: 1.5px; }
      .client-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #e6edf3; }
      .edge-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; }
      .edge-sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-style: italic; fill: #93c5fd; }
      .gateway-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #f0f6fc; }
      .gateway-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: italic; fill: #8b949e; }
      .svc-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
      .svc-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: italic; fill: #8b949e; }
      .flow-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: italic; fill: #8b949e; }
      .legend-lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; font-style: italic; }
      .rule-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #8b949e; }
      .rule-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #6e7681; letter-spacing: 1px; }

      .pulse {
        fill: #38bdf8;
        filter: drop-shadow(0 0 6px #38bdf8);
      }
    </style>

    <filter id="blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6e7681" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="860" fill="#0d1117" />

  <!-- Header Title -->
  <g transform="translate(45, 45)">
    <text class="main-title">Uber DOMA Architecture</text>
    <text y="26" class="main-sub">Domain-Oriented Microservice Architecture — Tiered Traffic Routing</text>
  </g>

  <!-- Outer Container Card -->
  <g transform="translate(45, 95)">
    <rect width="910" height="630" rx="16" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />

    <!-- ================= 1. CLIENT LAYER ================= -->
    <g transform="translate(45, 25)">
      <rect width="820" height="80" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">CLIENT LAYER</text>

      <!-- Client Capsule -->
      <g transform="translate(310, 18)">
        <rect width="200" height="46" rx="23" fill="#181d27" stroke="#363e4f" stroke-width="1.2" />
        <text x="100" y="29" class="client-text" text-anchor="middle">Mobile Client</text>
      </g>
    </g>

    <!-- Path: Client -> Edge Gateway -->
    <path id="path-client-edge" d="M 455 105 L 455 145" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <text x="455" y="125" class="flow-label" text-anchor="middle">gRPC / HTTP</text>
    <!-- Cyan Pulse on Path -->
    <circle r="4.5" class="pulse">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 455 105 L 455 145" />
    </circle>

    <!-- ================= 2. EDGE GATEWAY LAYER ================= -->
    <g transform="translate(45, 125)">
      <rect width="820" height="110" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">EDGE GATEWAY LAYER</text>

      <!-- Edge Layer Gateway Pill -->
      <g transform="translate(285, 22)">
        <rect width="250" height="68" rx="34" fill="#182848" stroke="#38bdf8" stroke-width="1.5" filter="url(#blue-glow)" />
        <text x="125" y="32" class="edge-title" text-anchor="middle">Edge Layer Gateway</text>
        <text x="125" y="52" class="edge-sub" text-anchor="middle">Ingress Auth &amp; Routing</text>
      </g>
    </g>

    <!-- Paths from Edge Gateway to Domain Gateways -->
    <!-- Left path to Trip Domain -->
    <path id="path-edge-trip" d="M 370 193 C 330 193 250 193 250 255" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 370 193 C 330 193 250 193 250 255" />
    </circle>

    <!-- Right path to Fare Domain -->
    <path id="path-edge-fare" d="M 540 193 C 580 193 660 193 660 255" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 540 193 C 580 193 660 193 660 255" />
    </circle>

    <!-- ================= 3. DOMAIN GATEWAY LAYER ================= -->
    <g transform="translate(45, 255)">
      <rect width="820" height="140" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">DOMAIN GATEWAY LAYER</text>

      <!-- Trip Domain Gateway -->
      <g transform="translate(115, 26)">
        <rect width="170" height="80" rx="16" fill="#161b26" stroke="#363e4f" stroke-width="1.2" />
        <text x="85" y="38" class="gateway-title" text-anchor="middle">Trip Domain</text>
        <text x="85" y="58" class="gateway-sub" text-anchor="middle">Gateway Tier</text>
      </g>

      <!-- Fare Domain Gateway -->
      <g transform="translate(535, 26)">
        <rect width="170" height="80" rx="16" fill="#161b26" stroke="#363e4f" stroke-width="1.2" />
        <text x="85" y="38" class="gateway-title" text-anchor="middle">Fare Domain</text>
        <text x="85" y="58" class="gateway-sub" text-anchor="middle">Gateway Tier</text>
      </g>

      <!-- Inter-Gateway Communication (Cross-Domain Bridge) -->
      <path id="path-cross-domain" d="M 285 66 L 535 66" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
      <text x="410" y="60" class="flow-label" text-anchor="middle">Cross-Domain</text>
      <circle r="4.5" class="pulse">
        <animateMotion dur="2.4s" repeatCount="indefinite" path="M 285 66 L 535 66" />
      </circle>
    </g>

    <!-- Paths from Domain Gateways to Microservices -->
    <!-- Trip Domain to Driver Match -->
    <path id="path-trip-driver" d="M 170 361 C 170 385 180 405 180 440" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 170 361 C 170 385 180 405 180 440" />
    </circle>

    <!-- Trip Domain to Route Planner -->
    <path id="path-trip-route" d="M 230 361 C 230 395 385 395 385 440" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.3s" repeatCount="indefinite" path="M 230 361 C 230 395 385 395 385 440" />
    </circle>

    <!-- Fare Domain to Payment Core -->
    <path id="path-fare-payment" d="M 585 361 C 585 395 535 395 535 440" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.1s" repeatCount="indefinite" path="M 585 361 C 585 395 535 395 535 440" />
    </circle>

    <!-- Fare Domain to Invoice Engine -->
    <path id="path-fare-invoice" d="M 645 361 C 645 385 710 405 710 440" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowhead)" fill="none" />
    <circle r="4" class="pulse">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 645 361 C 645 385 710 405 710 440" />
    </circle>

    <!-- ================= 4. MICROSERVICE LAYER ================= -->
    <g transform="translate(45, 415)">
      <rect width="820" height="150" rx="10" fill="#12161f" stroke="#232a36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="18" y="24" class="layer-tag">MICROSERVICE LAYER</text>

      <!-- 1. Driver Match -->
      <g transform="translate(48, 42)">
        <rect width="165" height="74" rx="12" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
        <text x="82" y="34" class="svc-title" text-anchor="middle">Driver Match</text>
        <text x="82" y="54" class="svc-sub" text-anchor="middle">Microservice</text>
      </g>

      <!-- 2. Route Planner -->
      <g transform="translate(238, 42)">
        <rect width="165" height="74" rx="12" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
        <text x="82" y="34" class="svc-title" text-anchor="middle">Route Planner</text>
        <text x="82" y="54" class="svc-sub" text-anchor="middle">Microservice</text>
      </g>

      <!-- 3. Payment Core -->
      <g transform="translate(428, 42)">
        <rect width="165" height="74" rx="12" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
        <text x="82" y="34" class="svc-title" text-anchor="middle">Payment Core</text>
        <text x="82" y="54" class="svc-sub" text-anchor="middle">Microservice</text>
      </g>

      <!-- 4. Invoice Engine -->
      <g transform="translate(618, 42)">
        <rect width="165" height="74" rx="12" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
        <text x="82" y="34" class="svc-title" text-anchor="middle">Invoice Engine</text>
        <text x="82" y="54" class="svc-sub" text-anchor="middle">Microservice</text>
      </g>
    </g>

    <!-- Legend -->
    <g transform="translate(200, 588)">
      <g transform="translate(0, 0)">
        <rect width="14" height="14" rx="4" fill="#182848" stroke="#38bdf8" stroke-width="1.2" />
        <text x="24" y="12" class="legend-lbl">Ingress Gateway</text>
      </g>

      <g transform="translate(180, 0)">
        <rect width="14" height="14" rx="4" fill="#161b26" stroke="#6e7681" stroke-width="1.2" />
        <text x="24" y="12" class="legend-lbl">Domain Gateway</text>
      </g>

      <g transform="translate(360, 0)">
        <rect width="14" height="14" rx="4" fill="#161b26" stroke="#28303e" stroke-width="1.2" />
        <text x="24" y="12" class="legend-lbl">Microservice Node</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: DOMA Topology Overview | SYSTEM RULE -->
  <g transform="translate(45, 745)">
    <rect width="910" height="60" rx="10" fill="#12161f" stroke="#1f2530" stroke-width="1.5" />
    <text x="24" y="35" class="rule-title">DOMA Ride Sharing Topology</text>
    <text x="886" y="35" class="rule-tag" text-anchor="end">SYSTEM RULE: AGNOSTIC DOWNWARD DEPENDENCIES</text>
  </g>
</svg>
